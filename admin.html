<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jimson Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header class="nav"><a class="brand" href="index.html">JIMSON<span>.</span></a><nav><a href="index.html">返回网站</a></nav></header>
<main class="section"><div class="section-head"><p class="eyebrow">ADMIN DASHBOARD</p><h2>网站后台</h2></div>
<div id="login" class="glass" style="max-width:480px"><h3>管理员登录</h3><p>这是前端演示版后台。正式公开部署时，请把登录和数据存储接到 Supabase/Firebase 等服务。</p><input id="pw" type="password" placeholder="输入后台密码" style="width:100%;padding:13px;border-radius:10px;border:1px solid #ffffff20;background:#080a0f;color:white"><button class="btn primary" onclick="login()" style="margin-top:12px">登录</button></div>
<div id="dashboard" style="display:none">
<div class="glass"><h3>新增项目</h3><input id="pt" placeholder="项目标题" class="field"><input id="ptag" placeholder="分类，例如 Design" class="field"><textarea id="pd" placeholder="项目介绍" class="field"></textarea><button class="btn primary" onclick="addProject()">发布项目</button></div>
<div class="glass" style="margin-top:18px"><h3>上传图片</h3><input id="photo" type="file" accept="image/*"><input id="photoTitle" placeholder="图片标题" class="field"><button class="btn primary" onclick="addPhoto()">加入相册</button><p style="color:#8992a7;font-size:13px">演示版会把图片保存到浏览器本地。正式版需要接云端 Storage，才能让所有访客看到。</p></div>
<div class="glass" style="margin-top:18px"><h3>当前项目</h3><div id="items"></div><button class="btn" onclick="logout()">退出登录</button></div>
</div></main><footer>Jimson Admin</footer>
<script>
const KEY="jimsonData";const PASS="jimson2026";
function data(){return JSON.parse(localStorage.getItem(KEY)||'{"projects":[],"gallery":[]}')}
function login(){if(document.getElementById("pw").value===PASS){sessionStorage.admin="1";show()}else alert("密码不正确")}
function show(){if(sessionStorage.admin){loginBox.style.display="none";dashboard.style.display="block";renderItems()}}
function addProject(){let d=data();d.projects.push({title:pt.value,tag:ptag.value||"Project",desc:pd.value});save(d);pt.value=ptag.value=pd.value="";renderItems();alert("项目已加入")}
function addPhoto(){let f=photo.files[0];if(!f)return alert("请选择图片");let r=new FileReader();r.onload=()=>{let d=data();d.gallery.push({src:r.result,title:photoTitle.value});save(d);photo.value=photoTitle.value="";renderItems();alert("图片已加入相册")};r.readAsDataURL(f)}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function renderItems(){let d=data();items.innerHTML=d.projects.map((p,i)=>`<p>${p.title} <button onclick="del(${i})">删除</button></p>`).join("")}
function del(i){let d=data();d.projects.splice(i,1);save(d);renderItems()}
function logout(){sessionStorage.clear();location.reload()}
const loginBox=document.getElementById("login"),dashboard=document.getElementById("dashboard"),items=document.getElementById("items"),pt=document.getElementById("pt"),ptag=document.getElementById("ptag"),pd=document.getElementById("pd"),photo=document.getElementById("photo"),photoTitle=document.getElementById("photoTitle");show();
</script>
<style>.field{display:block;width:100%;margin:10px 0;padding:13px;border-radius:10px;border:1px solid #ffffff20;background:#080a0f;color:white;font:inherit}textarea.field{min-height:120px}</style>
</body></html>
